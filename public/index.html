<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ไปเดินภูสอยดาวกัน · By Bookky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f3e8;
    --panel: #ffffff;
    --panel-2: #eef2e2;
    --line: #d9dcc6;
    --line-soft: #e6e8d8;
    --text: #253321;
    --text-dim: #5c6b52;
    --text-faint: #8b9680;
    --pine: #2f5233;
    --pine-dark: #1c3220;
    --moss: #6f9954;
    --moss-light: #e3ecd8;
    --amber: #c98a2f;
    --amber-light: #f6e6c8;
    --amber-dark: #6b4713;
    --danger: #b6503f;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Thai', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 0 0 48px; }
  .hero{
    position: relative;
    overflow: hidden;
    padding: 40px 24px 28px;
    background: linear-gradient(180deg,#e9edd9 0%, var(--bg) 82%);
    border-bottom: 1px solid var(--line);
  }
  .hero svg{ position:absolute; left:0; right:0; bottom:0; width:100%; height:auto; }
  .hero-content{ position:relative; z-index:2; }
  .eyebrow{
    font-size: 12px; letter-spacing: 0.12em; color: var(--amber-dark);
    text-transform: uppercase; font-weight:600; margin: 0 0 10px;
  }
  h1{
    font-family:'Kanit', sans-serif; font-weight:700; font-size: 34px;
    margin: 0 0 10px; line-height:1.2; color: var(--pine-dark);
  }
  .sub{ font-size: 15px; color: var(--text-dim); max-width: 480px; line-height:1.6; margin:0; }

  .tab-bar{ display:flex; gap:8px; margin-top:18px; position:relative; z-index:2; }
  .tab-btn{
    font-family: inherit; font-size:13.5px; font-weight:500; padding:9px 16px;
    border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.55);
    color: var(--text-dim); cursor:pointer;
  }
  .tab-btn.active{ background: var(--pine); border-color: var(--pine); color:#fff; }

  .section{ padding: 28px 24px 0; }
  .card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding: 18px 20px;
  }
  label.field-label{
    display:block; font-size:13px; color: var(--text-dim); margin-bottom:8px; font-weight:500;
  }
  input[type=text]{
    width:100%; background: var(--moss-light); border:1px solid var(--line);
    color: var(--text); border-radius:10px; padding: 11px 14px; font-size:15px;
    font-family: inherit;
  }
  input[type=text]:focus{ outline:none; border-color: var(--pine); }
  .hint{ font-size:12.5px; color: var(--text-faint); margin-top:8px; }
  .hint.warn{ color: var(--danger); }

  .week-row{ margin-top: 22px; }
  .week-label{
    font-size: 12.5px; color: var(--text-dim); font-weight:600; margin-bottom: 10px;
    display:flex; align-items:center; gap:8px;
  }
  .week-label .rule{ flex:1; height:1px; background: var(--line-soft); }
  .day-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .day-card{
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 10px 12px; text-align:center; cursor:pointer; user-select:none;
    transition: border-color .12s ease, background .12s ease;
    position: relative;
  }
  .day-card:hover{ border-color: var(--moss); background: var(--moss-light); }
  .day-card.picked{ border-color: var(--pine); background: var(--pine); }
  .day-card.top{ border-color: var(--amber); }
  .day-name{ font-size:12px; color: var(--text-dim); font-weight:600; margin-bottom:4px; }
  .day-card.picked .day-name{ color: #d7e6d4; }
  .day-num{ font-family:'Kanit', sans-serif; font-size:24px; font-weight:600; line-height:1.1; }
  .day-card.picked .day-num{ color: #ffffff; }
  .day-month{ font-size:11.5px; color: var(--text-faint); margin-top:2px; }
  .day-card.picked .day-month{ color: #b9d0b6; }
  .day-count{
    margin-top:8px; display:inline-flex; align-items:center; gap:4px;
    font-size:12px; font-weight:600; color: var(--text-dim);
    background: var(--moss-light); border-radius:20px; padding:3px 9px;
  }
  .day-card.picked .day-count{ background: rgba(255,255,255,0.18); color:#eef6ec; }
  .star-badge{
    position:absolute; top:-8px; right:-6px; background: var(--amber); color: var(--amber-dark);
    font-size:10px; font-weight:700; padding:3px 7px; border-radius:20px;
    box-shadow: 0 0 0 3px var(--bg);
  }

  h2.section-title{
    font-family:'Kanit', sans-serif; font-size:17px; font-weight:600; margin: 0 0 14px; color: var(--pine-dark);
  }
  .empty{ color: var(--text-faint); font-size:13.5px; padding: 8px 0; }

  .stats-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card{
    background: var(--panel); border:1px solid var(--line); border-radius:12px;
    padding: 12px 14px;
  }
  .stat-num{ font-family:'Kanit', sans-serif; font-size:26px; font-weight:600; color: var(--pine-dark); line-height:1.1; }
  .stat-label{ font-size:12px; color: var(--text-dim); margin-top:4px; }

  .hero-pick{
    background: var(--amber-light); border: 1px solid var(--amber);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
  }
  .hero-pick-label{
    font-size:11.5px; font-weight:600; color: var(--amber-dark); text-transform:uppercase;
    letter-spacing:0.06em; margin-bottom:6px;
  }
  .hero-pick-date{ font-family:'Kanit', sans-serif; font-size:22px; font-weight:600; color: var(--pine-dark); }
  .hero-pick-count{ font-size:13.5px; color: var(--amber-dark); font-weight:500; margin-top:4px; }
  .hero-pick-names{ font-size:13px; color: var(--text-dim); margin-top:6px; }

  .bar-row{ margin-bottom: 10px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:5px; }
  .bar-date{ font-weight:500; }
  .bar-count{ font-family:'Kanit', sans-serif; font-weight:600; color: var(--pine); }
  .bar-track{ background: var(--moss-light); border-radius:6px; height:8px; overflow:hidden; }
  .bar-fill{ background: var(--moss); height:100%; border-radius:6px; }
  .bar-names{ font-size:11.5px; color: var(--text-faint); margin-top:4px; }

  .summary-toggle{
    display:block; width:100%; margin-top:14px; padding:9px 0; text-align:center;
    background: var(--moss-light); border: 1px solid var(--line); border-radius:10px;
    color: var(--pine-dark); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;
  }
  .summary-toggle:hover{ background: var(--line-soft); }

  .foot{ padding: 22px 24px 0; }
  .foot-row{ display:flex; justify-content:space-between; align-items:center; }
  .reset-link{ font-size:12.5px; color: var(--text-faint); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; font-family:inherit; }
  .reset-link:hover{ color: var(--danger); }
  .status{ font-size:12px; color: var(--text-faint); }

  .manage-toggle{
    font-size:12.5px; color: var(--text-faint); background:none; border:none; cursor:pointer;
    text-decoration:underline; padding:0; font-family:inherit; margin-top:10px;
  }
  .manage-panel{ margin-top:14px; display:none; }
  .manage-panel.open{ display:block; }
  .manage-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0; border-bottom:1px solid var(--line-soft);
  }
  .manage-row:last-child{ border-bottom:none; }
  .manage-name{ font-size:14px; }
  .manage-del{
    font-size:12px; color: var(--danger); background:none; border:1px solid var(--danger);
    border-radius:8px; padding:4px 10px; cursor:pointer; font-family:inherit;
  }
  .manage-del:hover{ background: var(--danger); color:#fff; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <svg viewBox="0 0 720 150" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,150 0,100 60,58 110,92 170,48 230,96 290,66 350,102 410,52 470,96 530,62 590,102 650,72 720,98 720,150" fill="#c9d6b5" opacity="0.85"/>
      <polygon points="0,150 0,125 80,88 150,118 220,80 300,122 380,88 460,126 540,92 620,120 700,88 720,100 720,150" fill="#9fb583" opacity="0.9"/>
      <polygon points="0,150 0,140 90,118 160,138 230,112 310,140 390,116 470,140 550,116 630,138 700,116 720,124 720,150" fill="#4d6b3e"/>
    </svg>
    <div class="hero-content">
      <p class="eyebrow">นัดหมายทริป · By Bookky</p>
      <h1 id="pageTitle">ไปเดินภูสอยดาวกัน</h1>
      <p class="sub" id="pageSub">เลือกวัน ศุกร์ / เสาร์ / อาทิตย์ ที่คุณว่าง แล้วมาดูกันว่าสัปดาห์ไหนเพื่อนว่างพร้อมกันเยอะที่สุด</p>
      <div class="tab-bar" id="tabBar"></div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <label class="field-label" for="nameInput">ชื่อของคุณ</label>
      <input type="text" id="nameInput" placeholder="เช่น บุ๊คกี้" autocomplete="off">
      <p class="hint" id="nameHint">ใส่ชื่อก่อน แล้วค่อยแตะวันที่ว่างด้านล่างได้เลย</p>
      <button class="manage-toggle" id="manageToggle">จัดการรายชื่อทั้งหมด</button>
      <div class="manage-panel" id="managePanel">
        <div id="manageList"></div>
      </div>
    </div>
  </div>

  <div class="section" id="weeksSection">
    <h2 class="section-title">เลือกวันว่าง</h2>
    <div id="weeksContainer"></div>
  </div>

  <div class="section">
    <h2 class="section-title">สรุปภาพรวม</h2>
    <div class="card" id="summaryCard">
      <div class="empty">ยังไม่มีใครเลือกวันเลย</div>
    </div>
  </div>

  <div class="foot">
    <div class="foot-row">
      <button class="reset-link" id="resetBtn">ล้างตัวเลือกของฉัน</button>
      <span class="status" id="statusText"></span>
    </div>
  </div>

</div>

<script>
const THAI_DAY = { 5: 'ศ', 6: 'ส', 0: 'อา' };
const THAI_DAY_FULL = { 5: 'ศุกร์', 6: 'เสาร์', 0: 'อาทิตย์' };
const THAI_MONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

const TOPICS = [
  {
    key: 'phu-sao-dao',
    tabLabel: 'ภูสอยดาว',
    title: 'ไปเดินภูสอยดาวกัน',
    sub: 'เลือกวัน ศุกร์ / เสาร์ / อาทิตย์ ที่คุณว่าง แล้วมาดูกันว่าสัปดาห์ไหนเพื่อนว่างพร้อมกันเยอะที่สุด'
  },
  {
    key: 'friends-holidays',
    tabLabel: 'วันหยุดของเพื่อนๆ',
    title: 'วันหยุดของเพื่อนๆ',
    sub: 'เลือกวัน ศุกร์ / เสาร์ / อาทิตย์ ที่คุณว่างงานทั่วไป ใช้ดูวันว่างร่วมกันแบบไม่ผูกกับทริปไหนโดยเฉพาะ'
  }
];

let currentTopic = TOPICS[0].key;
let responses = {};
let currentName = '';
let summaryExpanded = false;

function getTopicConfig(){
  return TOPICS.find(t => t.key === currentTopic) || TOPICS[0];
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  TOPICS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.key === currentTopic ? ' active' : '');
    btn.textContent = t.tabLabel;
    btn.addEventListener('click', () => switchTopic(t.key));
    bar.appendChild(btn);
  });
}

async function switchTopic(topicKey){
  if(topicKey === currentTopic) return;
  currentTopic = topicKey;
  const cfg = getTopicConfig();
  document.getElementById('pageTitle').textContent = cfg.title;
  document.getElementById('pageSub').textContent = cfg.sub;
  renderTabs();
  summaryExpanded = false;
  await loadData();
  render();
}

function dateKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function buildDateList(){
  const days = [];
  const today = new Date();
  today.setHours(0,0,0,0);
  const cursor = new Date(today);
  const yearEnd = new Date(today.getFullYear(), 11, 31);
  while(cursor <= yearEnd){
    cursor.setDate(cursor.getDate() + 1);
    if(cursor > yearEnd) break;
    const dow = cursor.getDay();
    if(dow === 5 || dow === 6 || dow === 0){
      days.push(new Date(cursor));
    }
  }
  const weeks = [];
  for(let i = 0; i < days.length; i += 3){
    weeks.push(days.slice(i, i+3));
  }
  return weeks;
}

function countFor(key){
  let names = [];
  for(const name in responses){
    if(responses[name] && responses[name].includes(key)) names.push(name);
  }
  return names;
}

function maxCount(weeks){
  let m = 0;
  weeks.flat().forEach(d => {
    const c = countFor(dateKey(d)).length;
    if(c > m) m = c;
  });
  return m;
}

function setStatus(text){
  document.getElementById('statusText').textContent = text;
  if(text) setTimeout(() => { document.getElementById('statusText').textContent = ''; }, 2500);
}

async function loadData(){
  try{
    const res = await fetch('/api/responses?topic=' + encodeURIComponent(currentTopic));
    if(!res.ok) throw new Error('bad response');
    responses = await res.json();
  }catch(e){
    responses = {};
    setStatus('โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า');
  }
}

async function saveName(name){
  try{
    const res = await fetch('/api/responses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: currentTopic, name: name, dates: responses[name] || [] })
    });
    if(!res.ok) throw new Error('bad response');
    setStatus('บันทึกแล้ว');
  }catch(e){
    setStatus('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

function toggleDate(key){
  if(!currentName){
    document.getElementById('nameHint').textContent = 'กรุณาใส่ชื่อก่อนเลือกวันว่าง';
    document.getElementById('nameHint').classList.add('warn');
    document.getElementById('nameInput').focus();
    return;
  }
  if(!responses[currentName]) responses[currentName] = [];
  const idx = responses[currentName].indexOf(key);
  if(idx === -1){
    responses[currentName].push(key);
  }else{
    responses[currentName].splice(idx, 1);
  }
  render();
  saveName(currentName);
}

async function resetMine(){
  if(!currentName){ return; }
  responses[currentName] = [];
  render();
  await saveName(currentName);
}

async function deleteName(name){
  responses[name] = [];
  render();
  await saveName(name);
}

function render(){
  const weeks = buildDateList();
  const top = maxCount(weeks);
  const container = document.getElementById('weeksContainer');
  container.innerHTML = '';

  weeks.forEach(week => {
    const row = document.createElement('div');
    row.className = 'week-row';

    const label = document.createElement('div');
    label.className = 'week-label';
    const first = week[0];
    label.innerHTML = '<span>สัปดาห์ ' + first.getDate() + ' ' + THAI_MONTH[first.getMonth()] + '</span><span class="rule"></span>';
    row.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'day-grid';

    week.forEach(d => {
      const key = dateKey(d);
      const names = countFor(key);
      const picked = currentName && names.includes(currentName);
      const isTop = top > 0 && names.length === top;

      const cardEl = document.createElement('div');
      cardEl.className = 'day-card' + (picked ? ' picked' : '') + (isTop ? ' top' : '');
      cardEl.innerHTML =
        (isTop ? '<div class="star-badge">ยอดนิยม</div>' : '') +
        '<div class="day-name">' + THAI_DAY[d.getDay()] + '</div>' +
        '<div class="day-num">' + d.getDate() + '</div>' +
        '<div class="day-month">' + THAI_MONTH[d.getMonth()] + '</div>' +
        '<div class="day-count">' + names.length + ' คนว่าง</div>';
      cardEl.addEventListener('click', () => toggleDate(key));
      grid.appendChild(cardEl);
    });

    row.appendChild(grid);
    container.appendChild(row);
  });

  renderSummary(weeks);
  renderManageList();
}

function renderSummary(weeks){
  const card = document.getElementById('summaryCard');
  const all = weeks.flat().map(d => ({ d, key: dateKey(d), names: countFor(dateKey(d)) }))
    .filter(x => x.names.length > 0)
    .sort((a,b) => b.names.length - a.names.length || a.d - b.d);

  const totalPeople = Object.keys(responses).filter(n => responses[n] && responses[n].length > 0).length;

  if(all.length === 0){
    card.innerHTML =
      '<div class="stats-row">' +
        '<div class="stat-card"><div class="stat-num">' + totalPeople + '</div><div class="stat-label">คนตอบแล้ว</div></div>' +
        '<div class="stat-card"><div class="stat-num">0</div><div class="stat-label">วันที่มีคนว่าง</div></div>' +
      '</div>' +
      '<div class="empty">ยังไม่มีใครเลือกวันเลย</div>';
    summaryExpanded = false;
    return;
  }

  const top = all[0].names.length;
  const topPicks = all.filter(x => x.names.length === top);
  const rest = all.filter(x => x.names.length !== top);

  const COLLAPSED_COUNT = 4;
  const showCount = summaryExpanded ? rest.length : Math.min(COLLAPSED_COUNT, rest.length);
  const visibleRest = rest.slice(0, showCount);

  let html = '<div class="stats-row">' +
    '<div class="stat-card"><div class="stat-num">' + totalPeople + '</div><div class="stat-label">คนตอบแล้ว</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + all.length + '</div><div class="stat-label">วันที่มีคนว่าง</div></div>' +
  '</div>';

  topPicks.forEach(item => {
    html += '<div class="hero-pick">' +
      '<div class="hero-pick-label">ตัวเลือกยอดนิยม</div>' +
      '<div class="hero-pick-date">' + THAI_DAY_FULL[item.d.getDay()] + ' ' + item.d.getDate() + ' ' + THAI_MONTH[item.d.getMonth()] + '</div>' +
      '<div class="hero-pick-count">ว่าง ' + item.names.length + ' คน</div>' +
      '<div class="hero-pick-names">' + item.names.join(', ') + '</div>' +
    '</div>';
  });

  if(visibleRest.length > 0){
    visibleRest.forEach(item => {
      const pct = Math.round((item.names.length / top) * 100);
      html += '<div class="bar-row">' +
        '<div class="bar-top"><span class="bar-date">' + THAI_DAY_FULL[item.d.getDay()] + ' ' + item.d.getDate() + ' ' + THAI_MONTH[item.d.getMonth()] + '</span>' +
        '<span class="bar-count">' + item.names.length + '</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-names">' + item.names.join(', ') + '</div>' +
      '</div>';
    });
  }

  if(rest.length > COLLAPSED_COUNT){
    html += '<button class="summary-toggle" id="summaryToggleBtn">' +
      (summaryExpanded ? 'ย่อกลับ' : 'ดูทั้งหมด (' + rest.length + ' วันที่เหลือ)') +
      '</button>';
  }

  card.innerHTML = html;

  const toggleBtn = document.getElementById('summaryToggleBtn');
  if(toggleBtn){
    toggleBtn.addEventListener('click', () => {
      summaryExpanded = !summaryExpanded;
      renderSummary(weeks);
    });
  }
}

function renderManageList(){
  const list = document.getElementById('manageList');
  const names = Object.keys(responses).filter(n => responses[n] && responses[n].length > 0);
  if(names.length === 0){
    list.innerHTML = '<div class="empty">ยังไม่มีรายชื่อ</div>';
    return;
  }
  list.innerHTML = '';
  names.forEach(name => {
    const row = document.createElement('div');
    row.className = 'manage-row';
    row.innerHTML = '<span class="manage-name">' + name + ' (' + responses[name].length + ' วัน)</span>' +
      '<button class="manage-del">ลบ</button>';
    row.querySelector('.manage-del').addEventListener('click', () => {
      if(confirm('ลบรายชื่อ "' + name + '" ออกจากตารางใช่ไหม?')){
        deleteName(name);
      }
    });
    list.appendChild(row);
  });
}

document.getElementById('nameInput').addEventListener('input', (e) => {
  currentName = e.target.value.trim();
  const hint = document.getElementById('nameHint');
  hint.classList.remove('warn');
  hint.textContent = currentName ? 'แตะวันที่คุณว่างด้านล่างได้เลย' : 'ใส่ชื่อก่อน แล้วค่อยแตะวันที่ว่างด้านล่างได้เลย';
  render();
});

document.getElementById('resetBtn').addEventListener('click', resetMine);

document.getElementById('manageToggle').addEventListener('click', () => {
  document.getElementById('managePanel').classList.toggle('open');
});

(async function init(){
  renderTabs();
  await loadData();
  render();
  setInterval(async () => {
    await loadData();
    render();
  }, 8000);
})();
</script>
</body>
</html>
